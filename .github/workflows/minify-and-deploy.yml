name: Minify and Deploy

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install minifiers
        run: |
          npm install -g html-minifier-terser clean-css-cli uglify-js

      - name: Minify HTML
        run: |
          find . -name "*.html" -exec html-minifier-terser --collapse-whitespace --remove-comments --minify-css true --minify-js true -o {} {} \;

      - name: Minify CSS
        run: |
          find . -name "*.css" -exec cleancss -o {} {} \;

      - name: Minify JS
        run: |
          find . -name "*.js" -exec uglifyjs {} -c -m -o {} \;

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
