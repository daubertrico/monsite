name: Minify and Deploy

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install minifiers
        run: |
          npm install -g html-minifier-terser clean-css-cli terser

      - name: Minify HTML
        run: |
          find . -name "*.html" -not -path "./.git/*" -not -path "./node_modules/*" -exec html-minifier-terser --collapse-whitespace --remove-comments --minify-css true --minify-js true -o {} {} \;

      - name: Minify CSS
        run: |
          find . -name "*.css" -not -path "./.git/*" -not -path "./node_modules/*" -exec cleancss -o {} {} \;

      - name: Minify JS (terser gère ES2020+ contrairement à uglify-js)
        run: |
          find . -name "*.js" -not -path "./.git/*" -not -path "./node_modules/*" -exec terser {} --compress --mangle -o {} \;

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          publish_branch: gh-pages
          force_orphan: true
