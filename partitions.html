<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Voix Libre - Partitions</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="internal-page">
    <header class="main-header">
        <div class="header-content">
            <a href="index.html" class="site-logo-link">
                <img src="" alt="Logo La Voix Libre" class="site-logo">
            </a>
            <div class="site-titles">
                <h1 id="page-main-title"></h1>
                <p id="page-subtitle" class="subtitle"></p>
            </div>
        </div>
        <nav class="main-nav">
            <ul class="nav-links">
                <li><a href="chorale-pop.html">Chorale Pop</a></li>
                <li><a href="comedie-musicale.html">Comédie Musicale</a></li>
                <li><a href="cours-de-chant.html">Cours de chant</a></li>
                <li><a href="soul.html">SOUL</a></li>
                <li><a href="evenements.html">Événements</a></li>
                <li><a href="videos.html">Nous entendre</a></li>
                <li><a href="partitions.html" class="active">Partitions</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>
    <main class="main-content">
        <div id="password-container" style="max-width:400px;margin:40px auto;text-align:center;">
          <label for="partition-password">Mot de passe :</label>
          <input type="password" id="partition-password" style="margin:10px;">
          <button id="partition-submit">Valider</button>
          <div id="partition-error" style="color:red;margin-top:10px;display:none;">Mot de passe incorrect.</div>
        </div>
        <div id="page-content-container" style="display:none;"></div>
    </main>
    <footer class="main-footer">
        <div class="footer-content">
            <p>&copy; 2024 La Voix Libre. Tous droits réservés.</p>
            <p>Contact : <a href="mailto:contact@lavoixlibre.fr">contact@lavoixlibre.fr</a></p>
        </div>
        <div class="social-links">
            <a href="https://facebook.com/" aria-label="Facebook" target="_blank">Facebook</a>
            <a href="https://instagram.com/" aria-label="Instagram" target="_blank">Instagram</a>
            <a href="https://youtube.com/" aria-label="YouTube" target="_blank">YouTube</a>
        </div>
    </footer>
    <script src="assets/js/main.js"></script>
    <script>
      async function getPartitionPassword() {
        try {
          const response = await fetch('data/pages.json');
          const pages = await response.json();
          const partitionPage = pages.find(p => p.id === 'partitions');
          return partitionPage && partitionPage.password ? partitionPage.password : null;
        } catch (e) {
          return null;
        }
      }

      function generatePageContent(pageId) {
        if (pageId !== 'partitions') return;
        const container = document.getElementById('page-content-container');
        container.innerHTML = `
          <h2>Partitions et ressources choristes</h2>
          <table id="partitions-table" style="width:100%;border-collapse:collapse;margin:2em 0;font-family:'Segoe UI',Arial,sans-serif;background:#fff;box-shadow:0 2px 8px #0002;">
            <thead>
              <tr>
                <th style="text-align:left;">Morceau</th>
                <th style="text-align:left;">Ressource</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        `;
        fetch('data/partitions.json')
          .then(res => res.json())
          .then(data => {
            const tbody = document.querySelector('#partitions-table tbody');
            data.forEach(partition => {
              const rows = [];
              // Cas particulier pour 'Because' : un seul lien texte/partition, pas de YouTube
              if (partition.title && partition.title.trim().toLowerCase() === 'because') {
                if (partition.drive_link) {
                  rows.push({ type: 'Texte/Partition', url: partition.drive_link });
                } else if (partition.musescore_link) {
                  rows.push({ type: 'Texte/Partition', url: partition.musescore_link.replace(/\/embed$/, '') });
                }
                if (partition.recordings_link) rows.push({ type: 'Enregistrements', url: partition.recordings_link });
                // Pas de YouTube pour Because
              } else {
                // Fusionne texte et partition en ligne pour les autres morceaux
                if (partition.drive_link && partition.musescore_link) {
                  rows.push({ type: 'Texte/Partition', url: partition.drive_link });
                  rows.push({ type: 'Texte/Partition', url: partition.musescore_link.replace(/\/embed$/, '') });
                } else if (partition.drive_link) {
                  rows.push({ type: 'Texte/Partition', url: partition.drive_link });
                } else if (partition.musescore_link) {
                  rows.push({ type: 'Texte/Partition', url: partition.musescore_link.replace(/\/embed$/, '') });
                }
                if (partition.recordings_link) rows.push({ type: 'Enregistrements', url: partition.recordings_link });
                if (partition.youtube_original) rows.push({ type: 'Youtube (original)', url: partition.youtube_original });
                if (partition.youtube_link) rows.push({ type: 'Youtube (notre version)', url: partition.youtube_link });
              }
              if (rows.length === 0) {
                tbody.innerHTML += `<tr><td>${partition.title || ''}</td><td></td></tr>`;
              } else {
                rows.forEach((r, i) => {
                  tbody.innerHTML += `<tr><td>${i === 0 ? (partition.title || '') : ''}</td><td><a href="${r.url}" target="_blank">${r.type}</a></td></tr>`;
                });
              }
            });
          });
      }

      document.addEventListener('DOMContentLoaded', function() {
        const passwordContainer = document.getElementById('password-container');
        const pageContentContainer = document.getElementById('page-content-container');
        const passwordInput = document.getElementById('partition-password');
        const submitBtn = document.getElementById('partition-submit');
        const errorMsg = document.getElementById('partition-error');

        submitBtn.addEventListener('click', async function() {
          const entered = passwordInput.value;
          const correct = await getPartitionPassword();
          if (entered === correct) {
            passwordContainer.style.display = 'none';
            pageContentContainer.style.display = '';
            generatePageContent('partitions');
          } else {
            errorMsg.style.display = 'block';
          }
        });
      });
    </script>
</body>
</html>
