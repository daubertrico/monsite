<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Voix Libre - Partitions</title>
    <link href="https://fonts.googleapis.com/css2?family=Lobster&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="internal-page">
    <header class="main-header">
        <div class="header-content">
            <a href="index.html" class="site-logo-link">
                <img src="" alt="Logo La Voix Libre" class="site-logo">
            </a>
            <div class="site-titles">
                <h1 id="page-main-title"></h1>
                <p id="page-subtitle" class="subtitle"></p>
            </div>
        </div>
        <nav class="main-nav">
            <ul class="nav-links">
                <li><a href="chorale-pop.html">Chorale Pop</a></li>
                <li><a href="soul.html">SOUL</a></li>
                <li><a href="comedie-musicale.html">Comédie Musicale</a></li>
                <li><a href="cours-de-chant.html">Cours de chant</a></li>
                <li><a href="evenements.html">Événements</a></li>
                <li><a href="videos.html">Nous entendre</a></li>
                <li><a href="partitions.html" class="active">Partitions</a></li>
                <li><a href="#footer">Contact</a></li>
            </ul>
        </nav>
    </header>
    <main class="main-content">
        <div id="password-container" style="max-width:400px;margin:40px auto;text-align:center;">
          <label for="partition-password">Mot de passe :</label>
          <input type="password" id="partition-password" style="margin:10px;">
          <button id="partition-submit">Valider</button>
          <div id="partition-error" style="color:red;margin-top:10px;display:none;">Mot de passe incorrect.</div>
        </div>
        <div id="page-content-container" style="display:none;"></div>
    </main>
    <footer class="main-footer">
        <div class="footer-content">
            <p>&copy; 2024 La Voix Libre. Tous droits réservés.</p>
            <p>Contact : <a href="mailto:contact@lavoixlibre.fr">contact@lavoixlibre.fr</a></p>
        </div>
        <div class="social-links">
            <a href="https://facebook.com/" aria-label="Facebook" target="_blank">Facebook</a>
            <a href="https://instagram.com/" aria-label="Instagram" target="_blank">Instagram</a>
            <a href="https://youtube.com/" aria-label="YouTube" target="_blank">YouTube</a>
        </div>
    </footer>
    <script src="assets/js/main.js"></script>
    <script>
      // Scroll to footer on Contact click
      document.addEventListener('DOMContentLoaded', function() {
        var contactLink = document.querySelector('.nav-links a[href="#footer"]');
        if (contactLink) {
          contactLink.addEventListener('click', function(e) {
            e.preventDefault();
            var footer = document.querySelector('footer');
            if (footer) {
              footer.scrollIntoView({ behavior: 'smooth' });
            }
          });
        }
      });
      async function getPartitionPassword() {
        try {
          const response = await fetch('data/pages.json');
          const pages = await response.json();
          const partitionPage = pages.find(p => p.id === 'partitions');
          return partitionPage && partitionPage.password ? partitionPage.password : null;
        } catch (e) {
          return null;
        }
      }

      function generatePageContent(pageId) {
        if (pageId !== 'partitions') return;
        const container = document.getElementById('page-content-container');
        container.innerHTML = `
          <div class="legal-warning" style="background:#fff3cd;color:#856404;border:1px solid #ffeeba;padding:12px 18px;margin-bottom:18px;border-radius:8px;font-size:1.05em;">
            <strong>Attention :</strong> Ces partitions sont des arrangements réalisés pour la chorale La Voix Libre. Elles sont protégées par le droit d’auteur et strictement réservées à un usage interne. Merci de ne pas les diffuser, partager ou utiliser en dehors du cadre de la chorale.
          </div>
          <h2>Partitions et ressources choristes</h2>
          <table id="partitions-table" style="width:100%;border-collapse:collapse;margin:2em 0;font-family:'Segoe UI',Arial,sans-serif;background:#fff;box-shadow:0 2px 8px #0002;">
            <thead>
              <tr>
                <th style="text-align:left;">Morceau</th>
                <th style="text-align:left;">Enregistrements</th>
                <th style="text-align:left;">Ressources</th>
                <th style="text-align:left;">Partitions interactives</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        `;
        fetch('data/partitions.json')
          .then(res => res.json())
          .then(data => {
            const tbody = document.querySelector('#partitions-table tbody');
            // Tri alphabétique sur le titre
            data.sort((a, b) => {
              if (!a.title) return 1;
              if (!b.title) return -1;
              return a.title.localeCompare(b.title, 'fr', { sensitivity: 'base' });
            });
            data.forEach(partition => {
              // Préparer les liens pour chaque colonne
              let recordingsLinks = [];
              let ressourcesLinks = [];
              let interactiveLinks = [];
              // Enregistrements (audio)
              if (partition.recordings) {
                partition.recordings.forEach(rec => {
                  recordingsLinks.push(`<a href="#" class="audio-link" data-src="${rec.file}">${rec.label}</a>`);
                });
              }
              if (partition.recordings_link) {
                recordingsLinks.push(`<a href="${partition.recordings_link}" target="_blank">Enregistrements</a>`);
              }
              // Ressources (pdf, jpg, png, docx, paroles)
              if (partition.documents) {
                partition.documents.forEach(doc => {
                  ressourcesLinks.push(`<a href="${doc.file}" target="_blank">${doc.label}</a>`);
                });
              }
              if (partition.paroles_prononciation_image) {
                ressourcesLinks.push(`<a href="${partition.paroles_prononciation_image}" target="_blank">Paroles & prononciation</a>`);
              }
              // Partitions interactives (flat.io, html)
              if (partition.interactive_link) {
                interactiveLinks.push(`<a href="${partition.interactive_link}" target="_blank">Partition interactive</a>`);
              } else if (partition.flatio_link) {
                interactiveLinks.push(`<a href="${partition.flatio_link}" target="_blank">Partition interactive</a>`);
              }
              // Affichage de la ligne
              tbody.innerHTML += `
                <tr>
                  <td>${partition.title || ''}</td>
                  <td>${recordingsLinks.join('<br>')}</td>
                  <td>${ressourcesLinks.join('<br>')}</td>
                  <td>${interactiveLinks.join('<br>')}</td>
                </tr>
                <tr><td colspan='4' style='padding:0;'><hr style='border:0;border-top:1.5px solid #e0e0e0;margin:0 0 0 0;'></td></tr>
              `;
            });
            // Gestion du lecteur audio pop-up
            document.addEventListener('click', function(e) {
              if (e.target.classList && e.target.classList.contains('audio-link')) {
                e.preventDefault();
                const src = e.target.getAttribute('data-src');
                let player = document.getElementById('popup-audio-player');
                if (!player) {
                  player = document.createElement('div');
                  player.id = 'popup-audio-player';
                  player.style.position = 'fixed';
                  player.style.bottom = '30px';
                  player.style.left = '50%';
                  player.style.transform = 'translateX(-50%)';
                  player.style.background = '#fff';
                  player.style.border = '1.5px solid #3981FF';
                  player.style.borderRadius = '12px';
                  player.style.boxShadow = '0 4px 24px rgba(0,0,0,0.12)';
                  player.style.padding = '16px 24px 12px 24px';
                  player.style.zIndex = '9999';
                  player.innerHTML = '<audio id="audio-player" controls style="width:320px;"></audio><button id="close-audio" style="margin-left:16px;font-size:1.2em;cursor:pointer;background:none;border:none;color:#3981FF;">✖</button>';
                  document.body.appendChild(player);
                  document.getElementById('close-audio').onclick = function() {
                    player.remove();
                  };
                }
                const audio = document.getElementById('audio-player');
                audio.src = src;
                audio.play();
              }
            });
          });
      }

      document.addEventListener('DOMContentLoaded', function() {
        const passwordContainer = document.getElementById('password-container');
        const pageContentContainer = document.getElementById('page-content-container');
        const passwordInput = document.getElementById('partition-password');
        const submitBtn = document.getElementById('partition-submit');
        const errorMsg = document.getElementById('partition-error');

        submitBtn.addEventListener('click', async function() {
          const entered = passwordInput.value;
          const correct = await getPartitionPassword();
          if (entered === correct) {
            passwordContainer.style.display = 'none';
            pageContentContainer.style.display = '';
            generatePageContent('partitions');
          } else {
            errorMsg.style.display = 'block';
          }
        });
      });
    </script>
</body>
</html>
