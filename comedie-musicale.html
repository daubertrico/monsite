<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">

    <title>La Voix Libre - Comédie Musicale</title>
    <link href="https://fonts.googleapis.com/css2?family=Lobster&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="internal-page">
    <header class="main-header">
        <div class="header-content">
            <a href="index.html" class="site-logo-link">
                <img src="" alt="Logo La Voix Libre" class="site-logo">
            </a>
            <div class="site-titles">
                <h1 id="page-main-title"></h1>
                <p id="page-subtitle" class="subtitle"></p>
            </div>
        </div>
        <nav class="main-nav">
            <ul class="nav-links">
                <li><a href="chorale-pop.html">Chorale Pop</a></li>
                <li><a href="soul.html">SOUL</a></li>
                <li><a href="comedie-musicale.html" class="active">Comédie Musicale</a></li>
                <li><a href="cours-de-chant.html">Cours de chant</a></li>
                <li><a href="evenements.html">Événements</a></li>
                <li><a href="videos.html">Nous entendre</a></li>
                <li><a href="espace-choristes.html">Espace choristes</a></li>
                <li><a href="#footer">Contact</a></li>
            </ul>
        </nav>
    </header>
    <main class="main-content">
        <div id="page-content-container"></div>
    </main>
    <footer class="main-footer">
        <div class="footer-content">
            <p>&copy; 2024 La Voix Libre. Tous droits réservés.</p>
            <p>Contact : <a href="mailto:contact@lavoixlibre.fr">contact@lavoixlibre.fr</a></p>
        </div>
        <div class="social-links">
            <a href="https://facebook.com/" aria-label="Facebook" target="_blank">Facebook</a>
            <a href="https://instagram.com/" aria-label="Instagram" target="_blank">Instagram</a>
            <a href="https://youtube.com/" aria-label="YouTube" target="_blank">YouTube</a>
        </div>
        <div class="newsletter-link" style="margin-top:10px;">
            <a href="#newsletter" id="newsletter-btn" aria-label="Newsletter La Voix Libre" style="display:inline-flex;align-items:center;text-decoration:none;vertical-align:middle;background:#ff6699;color:#fff;font-family:'Open Sans',Arial,sans-serif;font-size:18px;font-weight:bold;border-radius:6px;padding:8px 20px;box-shadow:0 2px 8px rgba(0,0,0,0.12);transition:background 0.2s,box-shadow 0.2s;cursor:pointer;margin:0 auto;min-height:40px;" onclick="event.preventDefault();document.getElementById('newsletter-popup').style.display='flex';">
                <span style="display:inline-block;vertical-align:middle;height:24px;width:24px;margin-right:8px;">
                    <!-- Icône SVG newsletter -->
                    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" style="height:24px;width:24px;">
                      <rect x="3" y="5" width="18" height="14" rx="2" fill="#fff"/>
                      <path d="M3 7l9 6 9-6" stroke="#ff6699" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </span>
                <span style="color:#fff;font-family:'Open Sans',Arial,sans-serif;font-size:18px;vertical-align:middle;">S'inscrire à la newsletter</span>
            </a>
            <style>
            #newsletter-btn {
                border: 2px solid #ff6699;
            }
            #newsletter-btn:hover {
                background:#ff3366;
                border-color:#ff3366;
                box-shadow:0 4px 16px rgba(0,0,0,0.18);
                text-decoration:none;
            }
            </style>
        </div>
        </div>
    </footer>
    <!-- Popup Newsletter -->
    <div id="newsletter-popup" style="display:none;position:fixed;top:0;left:0;width:100vw;height:100vh;background:rgba(0,0,0,0.6);z-index:9999;justify-content:center;align-items:center;">
      <div style="background:#fff;padding:32px 24px;border-radius:8px;max-width:420px;width:90%;position:relative;box-shadow:0 4px 24px rgba(0,0,0,0.2);">
        <button id="close-newsletter-popup" style="position:absolute;top:12px;right:12px;background:none;border:none;font-size:22px;cursor:pointer;">&times;</button>
        
      </div>
    </div>
    <script>
      // Affiche le popup au clic sur le bouton
      document.getElementById('newsletter-btn').onclick = function() {
        document.getElementById('newsletter-popup').style.display = 'flex';
      };
      // Ferme le popup au clic sur la croix
      document.getElementById('close-newsletter-popup').onclick = function() {
        document.getElementById('newsletter-popup').style.display = 'none';
      };
      // Ferme le popup si on clique en dehors du contenu
      document.getElementById('newsletter-popup').onclick = function(e) {
        if (e.target === this) this.style.display = 'none';
      };
    </script>
    <script src="assets/js/main.js"></script>
    <script>
      document.addEventListener('DOMContentLoaded', function() {
        if (typeof generatePageContent === 'function') {
          generatePageContent('comedie-musicale');
        }
        var contactLink = document.querySelector('.nav-links a[href="#footer"]');
        if (contactLink) {
          contactLink.addEventListener('click', function(e) {
            e.preventDefault();
            var footer = document.querySelector('footer');
            if (footer) {
              footer.scrollIntoView({ behavior: 'smooth' });
            }
          });
        }
      });
    </script>
</body>
