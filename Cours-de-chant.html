<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cours de chant – La Voix Libre</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <img id="logo" alt="logo" />
    <h1 id="site-title"></h1>
  </header>

  <main id="cours-chant-content">
    <section class="hero">
      <img src="assets/images/vincentdauberlieu.jpg" alt="Vincent T-Dauberlieu" />
      <h2 id="cours-titre"></h2>
    </section>

    <section class="bio">
      <p id="cours-bio"></p>
    </section>

    <section class="cours">
      <h3>Le cours</h3>
      <p id="cours-description"></p>
      <div id="cours-audio"></div>
    </section>
  </main>

  <footer>
    <p>Contact : <span id="email"></span></p>
    <p>
      <a id="facebook" href="#">Facebook</a> |
      <a id="instagram" href="#">Instagram</a> |
      <a id="youtube" href="#">YouTube</a>
    </p>
  </footer>

  <script>
    const CONFIG_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRkJ42kW7oEyfNgrVq0i1sINnPjzcXxnYrmMUqUK-RQj3sM4_DxxXVUgu9NJrSm1Cke6stqQWNFoj41/pub?output=csv";

    async function loadConfig() {
      const res = await fetch(CONFIG_URL);
      const text = await res.text();
      const rows = text.split("\n").map(r => r.split(","));
      rows.forEach(([section, champ, valeur]) => {
        if (section === "head" && champ === "site_title") {
          document.title = "Cours de chant – " + valeur;
          document.getElementById("site-title").innerText = valeur;
        } else if (section === "head" && champ === "logo_url") {
          document.getElementById("logo").src = valeur;
        } else if (section === "footer") {
          const el = document.getElementById(champ);
          if (el) el.href = valeur;
          if (champ === "email") document.getElementById("email").innerText = valeur;
        }
      });
    }

    async function loadPageContent() {
      const res = await fetch(CONFIG_URL);
      const text = await res.text();
      const rows = text.split("\n").map(r => r.split(","));
      rows.forEach(([page_id, section, champ, valeur]) => {
        if (page_id === "cours_de_chant") {
          if (champ === "titre") document.getElementById("cours-titre").innerText = valeur;
          if (champ === "texte" && section === "bio") document.getElementById("cours-bio").innerText = valeur;
          if (champ === "texte" && section === "cours") document.getElementById("cours-description").innerText = valeur;
          if (champ === "soundcloud" && section === "portrait") {
            document.getElementById("cours-audio").innerHTML = `<iframe width="100%" height="166" scrolling="no" frameborder="no" allow="autoplay" src="${valeur}"></iframe>`;
          }
        }
      });
    }

    loadConfig();
    loadPageContent();
  </script>
</body>
</html>
