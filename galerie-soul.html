  <style>
    /* ---- Barre d'action en haut ---- */
    .gallery-actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      max-width: 1000px;
      margin: 0 auto 1.6rem auto;
    }
    .gallery-actions-intro {
      margin: 0;
      color: #555;
      font-size: 0.97rem;
    }

    /* ---- Section galerie : plus large que Insta/YouTube pour mettre en valeur la mosaïque ---- */
    .gallery-section {
      max-width: 1000px;
      margin: 0 auto 2.6rem auto;
      padding: 0;
    }
    .insta-section   { margin-bottom: 2.6rem; }
    .gallery-section .home-section-divider,
    .insta-section .home-section-divider,
    .youtube-section .home-section-divider {
      margin: 0 0 1rem 0;
    }

    /* ---- Groupes par concert (titre + grille) ---- */
    .gallery-group { margin: 0 0 2.2rem 0; }
    .gallery-group:last-child { margin-bottom: 0; }
    .gallery-group-title {
      font-family: 'Lobster', cursive;
      font-size: 1.25rem;
      color: var(--accent-color-complementary);
      font-weight: 400;
      text-align: center;
      margin: 0 auto 0.8rem auto;
      max-width: 1000px;
      line-height: 1.2;
    }

    /* ---- Mosaïque (masonry) — photos en vraies proportions, vraiment collées ---- */
    .photo-mosaic {
      column-count: 3;
      column-gap: 0;
      margin: 8px auto 0 auto;
      max-width: 1000px;
    }
    .photo-mosaic figure {
      margin: 0;
      border-radius: 0;
      overflow: hidden;
      cursor: pointer;
      position: relative;
      background: #eee;
      break-inside: avoid;
      display: block;
    }
    .photo-mosaic figure img {
      width: 100%;
      height: auto;
      display: block;
      transition: opacity 0.2s ease;
    }
    .photo-mosaic figure:hover img {
      opacity: 0.92;
    }
    .photo-mosaic figure figcaption {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      display: flex;
      flex-direction: column;
      gap: 2px;
      background: linear-gradient(to top, rgba(0,0,0,0.72), rgba(0,0,0,0.15) 70%, transparent);
      color: #fff;
      font-size: 0.8rem;
      padding: 24px 10px 9px 10px;
      opacity: 0;
      transition: opacity 0.25s;
    }
    .photo-mosaic figure:hover figcaption,
    .photo-mosaic figure:focus figcaption {
      opacity: 1;
    }
    .photo-mosaic figcaption .cap-desc {
      font-size: 0.88rem;
      font-weight: 600;
      line-height: 1.25;
    }
    .photo-mosaic figcaption .cap-meta {
      font-size: 0.76rem;
      color: rgba(255,255,255,0.82);
    }

    /* ---- Skeleton loader ---- */
    .photo-skeleton {
      aspect-ratio: 1 / 1;
      margin: 0;
      border-radius: 10px;
      background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
      background-size: 200% 100%;
      animation: shimmer 1.4s infinite;
    }
    @keyframes shimmer {
      0%   { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    /* ---- État vide / erreur ---- */
    .gallery-empty {
      text-align: center;
      padding: 48px 16px;
      color: #888;
      font-size: 1.05rem;
    }
    .gallery-empty a {
      color: var(--accent-color-primary);
      font-weight: 700;
    }

    /* ---- Lightbox ---- */
    #lightbox {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.88);
      z-index: 10000;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      padding: 16px;
    }
    #lightbox.open {
      display: flex;
    }
    #lightbox img {
      max-width: min(92vw, 1200px);
      max-height: 80vh;
      object-fit: contain;
      border-radius: 8px;
      box-shadow: 0 8px 40px rgba(0,0,0,0.6);
    }
    #lightbox-caption {
      color: rgba(255,255,255,0.85);
      margin-top: 14px;
      font-size: 0.95rem;
      text-align: center;
      max-width: 600px;
    }
    #lightbox-close {
      position: absolute;
      top: 16px;
      right: 20px;
      background: none;
      border: none;
      color: #fff;
      font-size: 2rem;
      cursor: pointer;
      line-height: 1;
      opacity: 0.75;
      transition: opacity 0.2s;
    }
    #lightbox-close:hover { opacity: 1; }
    #lightbox-prev, #lightbox-next {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(255,255,255,0.12);
      border: none;
      color: #fff;
      font-size: 2rem;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
    }
    #lightbox-prev { left: 12px; }
    #lightbox-next { right: 12px; }
    #lightbox-prev:hover, #lightbox-next:hover {
      background: rgba(255,255,255,0.25);
    }
    #lightbox-delete {
      position: absolute;
      top: 16px;
      left: 20px;
      background: rgba(239, 68, 68, 0.85);
      border: none;
      color: #fff;
      font-size: 0.92rem;
      font-weight: 700;
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
      display: none;
      align-items: center;
      gap: 6px;
      transition: background 0.18s;
    }
    #lightbox-delete:hover { background: rgba(220, 38, 38, 0.95); }
    #lightbox-delete:disabled { opacity: 0.6; cursor: wait; }

    @media (max-width: 600px) {
      .photo-mosaic { column-count: 2; column-gap: 0; }
      #lightbox-prev { left: 4px; }
      #lightbox-next { right: 4px; }
    }

    /* ---- CTA upload ---- */
    .gallery-upload-cta {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--accent-color-complementary);
      color: #fff;
      padding: 10px 20px;
      border-radius: 8px;
      font-weight: 700;
      text-decoration: none;
      font-size: 0.97rem;
      transition: background 0.2s;
      margin-bottom: 4px;
    }
    .gallery-upload-cta:hover { background: var(--accent-color-primary); color: #fff; }

    /* ---- Bouton "Supprimer des photos" (membres bureau uniquement) ---- */
    #gallery-select-btn {
      display: none;
      align-items: center;
      gap: 6px;
      background: #fff;
      color: #b91c1c;
      border: 2px solid #b91c1c;
      padding: 8px 14px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.92rem;
      cursor: pointer;
      transition: background 0.18s, color 0.18s;
    }
    #gallery-select-btn:hover { background: #fef2f2; }
    body.role-chef #gallery-select-btn { display: inline-flex; }
    body.gallery-select-mode #gallery-select-btn.has-selection {
      background: #b91c1c; color: #fff;
    }
    body.gallery-select-mode #gallery-select-btn.has-selection:hover { background: #991b1b; }

    /* ---- Encoches de sélection sur les vignettes ---- */
    .photo-mosaic figure .photo-check {
      display: none;
      position: absolute;
      top: 8px;
      left: 8px;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: rgba(255,255,255,0.92);
      border: 2px solid #b91c1c;
      align-items: center;
      justify-content: center;
      color: #b91c1c;
      font-weight: 900;
      font-size: 1rem;
      z-index: 2;
      pointer-events: none;
      box-shadow: 0 1px 4px rgba(0,0,0,0.2);
    }
    body.gallery-select-mode .photo-mosaic figure .photo-check { display: flex; }
    body.gallery-select-mode .photo-mosaic figure.selected .photo-check {
      background: #b91c1c; color: #fff;
    }
    body.gallery-select-mode .photo-mosaic figure.selected {
      outline: 3px solid #b91c1c;
      outline-offset: -3px;
    }
    body.gallery-select-mode .photo-mosaic figure { cursor: pointer; }
  </style>

  <script>
    // ---- Endpoint GAS (identique à galerie.html — mêmes photos en base, filtrées côté client) ----
    const PHOTOS_ENDPOINT = 'https://script.google.com/macros/s/AKfycbw1hqV4qB2XH0iAD4IOQkNiouXiWegHjRiSbtcGC9VRySr94xUKUdOtb8wWvIoHokTb/exec';

    // ---- État ----
    let allPhotos = [];
    let filteredPhotos = [];
    let lightboxIndex = 0;
    let eventMap = {};
    const selectedIds = new Set();

    // ---- Identité utilisateur ----
    function getCurrentUserName() {
      try {
        const p = JSON.parse(localStorage.getItem('choristeProfile') || '{}');
        const full = ((p.prenom || '') + ' ' + (p.nom || '')).trim();
        return full;
      } catch { return ''; }
    }
    function isChef() {
      try {
        return (localStorage.getItem('choristesRole') === 'chef')
            || (sessionStorage.getItem('choristesRole') === 'chef');
      } catch { return false; }
    }
    function normName(s) {
      return (s || '').toString()
        .normalize('NFD').replace(/[̀-ͯ]/g, '')
        .replace(/\s+/g, ' ').trim().toLowerCase();
    }
    function canDeletePhoto(photo) {
      if (isChef()) return true;
      const me = normName(getCurrentUserName());
      if (!me) return false;
      return normName(photo.uploaderName) === me;
    }

    // ---- Agendas : SOUL = source de cette galerie ----
    const CAL_API_KEY = 'AIzaSyDkjr4VKTHb1mzjUL_smPZslusM538Pbes';
    const SOUL_CALENDAR_ID = '566b739a047c4ccbdfaef5b1c27f57bd9810a47c22294678e1ed5cb74fc2e5ce@group.calendar.google.com';
    const soulEventIds = new Set(); // events SOUL → on garde ces photos

    function formatConcertLabel(summary, date) {
      const mois  = ['jan.','fév.','mars','avr.','mai','juin','juil.','août','sep.','oct.','nov.','déc.'];
      const jours = ['dim.','lun.','mar.','mer.','jeu.','ven.','sam.'];
      return (summary || 'Concert')
        + ' – ' + jours[date.getDay()]
        + ' ' + date.getDate()
        + ' ' + mois[date.getMonth()]
        + ' ' + date.getFullYear();
    }

    async function loadEventMap() {
      const timeMin = new Date(Date.now() - 5 * 365 * 24 * 3600 * 1000).toISOString();
      const timeMax = new Date(Date.now() + 365 * 24 * 3600 * 1000).toISOString();
      try {
        const url = 'https://www.googleapis.com/calendar/v3/calendars/'
          + encodeURIComponent(SOUL_CALENDAR_ID)
          + '/events?key=' + CAL_API_KEY
          + '&timeMin=' + encodeURIComponent(timeMin)
          + '&timeMax=' + encodeURIComponent(timeMax)
          + '&maxResults=250&orderBy=startTime&singleEvents=true';
        const res  = await fetch(url);
        const data = await res.json();
        (data.items || []).forEach(ev => {
          const start = ev.start && (ev.start.dateTime || ev.start.date);
          if (!start || !ev.id) return;
          soulEventIds.add(ev.id);
          eventMap[ev.id] = { name: ev.summary || 'Concert', date: new Date(start) };
        });
      } catch (e) {
        console.warn('Calendar fetch failed', e);
      }
    }

    function photoKey(photo) {
      return photo.eventId ? ('id:' + photo.eventId) : ('name:' + (photo.concert || 'Non précisé'));
    }
    function photoLabel(photo) {
      if (photo.eventId && eventMap[photo.eventId]) {
        const ev = eventMap[photo.eventId];
        return formatConcertLabel(ev.name, ev.date);
      }
      return photo.concert || 'Non précisé';
    }
    function photoDate(photo) {
      if (photo.eventId && eventMap[photo.eventId]) return eventMap[photo.eventId].date.getTime();
      return photo.uploadDate ? new Date(photo.uploadDate).getTime() : 0;
    }

    // ---- Chargement initial ----
    async function loadGallery() {
      const groupsEl = document.getElementById('gallery-groups');

      groupsEl.innerHTML = `<div class="photo-mosaic">${Array(6).fill('<div class="photo-skeleton"></div>').join('')}</div>`;

      if (!PHOTOS_ENDPOINT || PHOTOS_ENDPOINT.startsWith('REMPLACER')) {
        groupsEl.innerHTML = '<div class="gallery-empty"><p>La galerie n\'est pas encore configurée.</p></div>';
        return;
      }

      try {
        const url = PHOTOS_ENDPOINT + (PHOTOS_ENDPOINT.includes('?') ? '&' : '?') + 'action=gallery_list';
        const [, res] = await Promise.all([ loadEventMap(), fetch(url, { cache: 'no-store' }) ]);
        const data = await res.json();

        if (!data.photos || !data.photos.length) {
          groupsEl.innerHTML = '<div class="gallery-empty"><p>Aucune photo S.O.U.L. pour le moment.<br><a href="espace-choristes.html">Soyez le premier à en partager une !</a></p></div>';
          return;
        }

        // Filtre : on garde UNIQUEMENT les photos rattachées au calendrier SOUL.
        const photos = data.photos.filter(p => p.eventId && soulEventIds.has(p.eventId));

        if (!photos.length) {
          groupsEl.innerHTML = '<div class="gallery-empty"><p>Aucune photo S.O.U.L. pour le moment.<br><a href="espace-choristes.html">Soyez le premier à en partager une !</a></p></div>';
          return;
        }

        photos.forEach(p => { p._label = photoLabel(p); p._key = photoKey(p); });
        allPhotos = photos;
        renderGroupedGalleries();
      } catch (e) {
        groupsEl.innerHTML = '<div class="gallery-empty"><p>Impossible de charger la galerie. Réessayez plus tard.</p></div>';
        console.error('Gallery load error', e);
      }
    }

    function renderGroupedGalleries() {
      const groupsEl = document.getElementById('gallery-groups');
      const groups = {};
      allPhotos.forEach(p => {
        if (!groups[p._key]) {
          groups[p._key] = { key: p._key, label: p._label, date: photoDate(p), photos: [] };
        }
        groups[p._key].photos.push(p);
      });
      const list = Object.values(groups)
        .filter(g => g.photos.length > 0)
        .sort((a, b) => b.date - a.date);

      filteredPhotos = list.flatMap(g => g.photos);

      const esc = s => (s || '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c] || c));

      let flatIndex = 0;
      groupsEl.innerHTML = list.map(g => {
        const figs = g.photos.map(photo => {
          const i = flatIndex++;
          const thumb = `https://drive.google.com/thumbnail?id=${photo.fileId}&sz=w600`;
          const uploader = esc(photo.uploaderName || '');
          const description = esc(photo.description || '');
          const meta = uploader ? `par ${uploader}` : '';
          const capHtml = [
            description ? `<span class="cap-desc">${description}</span>` : '',
            meta ? `<span class="cap-meta">${meta}</span>` : ''
          ].filter(Boolean).join('');
          const altText = description || esc(g.label);
          const selectedCls = selectedIds.has(photo.fileId) ? ' selected' : '';
          return `
            <figure class="${selectedCls.trim()}" data-index="${i}" data-file-id="${esc(photo.fileId)}" role="button" tabindex="0" aria-label="Photo de ${esc(g.label)}">
              <span class="photo-check" aria-hidden="true">✓</span>
              <img src="${thumb}" alt="${altText}" loading="lazy" decoding="async"
                onerror="this.parentElement.style.display='none'">
              ${capHtml ? `<figcaption>${capHtml}</figcaption>` : ''}
            </figure>`;
        }).join('');
        return `
          <div class="gallery-group">
            <h3 class="gallery-group-title">${esc(g.label)}</h3>
            <div class="photo-mosaic">${figs}</div>
          </div>`;
      }).join('');

      groupsEl.querySelectorAll('figure').forEach(fig => {
        const handle = () => {
          if (document.body.classList.contains('gallery-select-mode')) {
            toggleSelectFigure(fig);
          } else {
            openLightbox(Number(fig.dataset.index));
          }
        };
        fig.addEventListener('click', handle);
        fig.addEventListener('keydown', e => {
          if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); handle(); }
        });
      });

      if (typeof syncYoutubeGapToBehold === 'function') syncYoutubeGapToBehold();
    }

    // ---- Lightbox ----
    function openLightbox(index) {
      lightboxIndex = index;
      showLightboxPhoto(index);
      document.getElementById('lightbox').classList.add('open');
      document.body.style.overflow = 'hidden';
    }
    function closeLightbox() {
      document.getElementById('lightbox').classList.remove('open');
      document.body.style.overflow = '';
    }
    function showLightboxPhoto(index) {
      const photo = filteredPhotos[index];
      if (!photo) return;
      const full = `https://drive.google.com/thumbnail?id=${photo.fileId}&sz=w1600`;
      const img = document.getElementById('lightbox-img');
      img.src = full;

      const concert = (photo._label || photo.concert || '').replace(/</g,'&lt;');
      const uploader = (photo.uploaderName || '').replace(/</g,'&lt;');
      const description = (photo.description || '').replace(/</g,'&lt;');
      img.alt = description || photo._label || photo.concert || '';
      const meta = [concert, uploader ? `partagée par ${uploader}` : ''].filter(Boolean).join(' · ');
      document.getElementById('lightbox-caption').innerHTML =
        (description ? `<span style="display:block;font-size:1.08rem;color:#fff;margin-bottom:4px;">${description}</span>` : '')
        + meta
        + `<span style="color:rgba(255,255,255,0.4);margin-left:10px;">${index+1} / ${filteredPhotos.length}</span>`;

      document.getElementById('lightbox-prev').style.display = filteredPhotos.length > 1 ? '' : 'none';
      document.getElementById('lightbox-next').style.display = filteredPhotos.length > 1 ? '' : 'none';

      const delBtn = document.getElementById('lightbox-delete');
      delBtn.style.display = canDeletePhoto(photo) ? 'inline-flex' : 'none';
      delBtn.disabled = false;
      delBtn.textContent = '🗑 Supprimer';
    }

    async function deleteCurrentPhoto() {
      const photo = filteredPhotos[lightboxIndex];
      if (!photo || !photo.fileId) return;
      if (!canDeletePhoto(photo)) return;

      const me = getCurrentUserName();
      const ok = confirm('Supprimer définitivement cette photo ?\n\nElle sera retirée de la galerie et mise à la corbeille Drive.');
      if (!ok) return;

      const delBtn = document.getElementById('lightbox-delete');
      delBtn.disabled = true;
      delBtn.textContent = 'Suppression…';

      try {
        const params = new URLSearchParams();
        params.set('action', 'delete_photo');
        params.set('data', JSON.stringify({
          fileId: photo.fileId,
          uploaderName: me,
          adminPassword: isChef() ? 'bureau' : ''
        }));
        const res = await fetch(PHOTOS_ENDPOINT, {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: params.toString()
        });
        const data = await res.json();
        if (data.error) throw new Error(data.error);

        allPhotos = allPhotos.filter(p => p.fileId !== photo.fileId);
        closeLightbox();
        if (allPhotos.length === 0) {
          document.getElementById('gallery-groups').innerHTML =
            '<div class="gallery-empty"><p>Aucune photo S.O.U.L. pour le moment.<br><a href="espace-choristes.html">Soyez le premier à en partager une !</a></p></div>';
        } else {
          renderGroupedGalleries();
        }
      } catch (e) {
        console.error('Delete error', e);
        alert('Échec de la suppression : ' + (e.message || 'erreur réseau'));
        delBtn.disabled = false;
        delBtn.textContent = '🗑 Supprimer';
      }
    }

    document.getElementById('lightbox-close').addEventListener('click', closeLightbox);
    document.getElementById('lightbox-delete').addEventListener('click', deleteCurrentPhoto);
    document.getElementById('lightbox').addEventListener('click', function(e) {
      if (e.target === this) closeLightbox();
    });
    document.getElementById('lightbox-prev').addEventListener('click', () => {
      lightboxIndex = (lightboxIndex - 1 + filteredPhotos.length) % filteredPhotos.length;
      showLightboxPhoto(lightboxIndex);
    });
    document.getElementById('lightbox-next').addEventListener('click', () => {
      lightboxIndex = (lightboxIndex + 1) % filteredPhotos.length;
      showLightboxPhoto(lightboxIndex);
    });
    document.addEventListener('keydown', e => {
      if (!document.getElementById('lightbox').classList.contains('open')) return;
      if (e.key === 'Escape')      closeLightbox();
      if (e.key === 'ArrowLeft')  { lightboxIndex = (lightboxIndex - 1 + filteredPhotos.length) % filteredPhotos.length; showLightboxPhoto(lightboxIndex); }
      if (e.key === 'ArrowRight') { lightboxIndex = (lightboxIndex + 1) % filteredPhotos.length; showLightboxPhoto(lightboxIndex); }
    });

    // ---- Mode sélection (bureau uniquement) ----
    function updateSelectBtn() {
      const btn = document.getElementById('gallery-select-btn');
      if (!btn) return;
      const inMode = document.body.classList.contains('gallery-select-mode');
      const n = selectedIds.size;
      if (!inMode) {
        btn.textContent = '🗑 Supprimer des photos';
        btn.classList.remove('has-selection');
        return;
      }
      if (n === 0) {
        btn.textContent = '✕ Annuler la sélection';
        btn.classList.remove('has-selection');
      } else {
        btn.textContent = '🗑 Supprimer la sélection (' + n + ')';
        btn.classList.add('has-selection');
      }
    }
    function toggleSelectFigure(fig) {
      const id = fig.dataset.fileId;
      if (!id) return;
      if (selectedIds.has(id)) {
        selectedIds.delete(id);
        fig.classList.remove('selected');
      } else {
        selectedIds.add(id);
        fig.classList.add('selected');
      }
      updateSelectBtn();
    }
    async function deleteSelectedPhotos() {
      const ids = Array.from(selectedIds);
      if (!ids.length) return;
      const ok = confirm('Supprimer ' + ids.length + ' photo(s) ?\n\nElles seront retirées de la galerie et mises à la corbeille Drive.');
      if (!ok) return;

      const btn = document.getElementById('gallery-select-btn');
      btn.disabled = true;
      const total = ids.length;
      let done = 0, failed = 0;

      for (const fileId of ids) {
        btn.textContent = 'Suppression… (' + (done + 1) + '/' + total + ')';
        try {
          const params = new URLSearchParams();
          params.set('action', 'delete_photo');
          params.set('data', JSON.stringify({
            fileId: fileId,
            uploaderName: getCurrentUserName(),
            adminPassword: 'bureau'
          }));
          const res = await fetch(PHOTOS_ENDPOINT, {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: params.toString()
          });
          const data = await res.json();
          if (data.error) throw new Error(data.error);
          allPhotos = allPhotos.filter(p => p.fileId !== fileId);
          done++;
        } catch (e) {
          console.error('Delete failed for ' + fileId, e);
          failed++;
        }
      }

      selectedIds.clear();
      document.body.classList.remove('gallery-select-mode');
      btn.disabled = false;
      updateSelectBtn();

      if (allPhotos.length === 0) {
        document.getElementById('gallery-groups').innerHTML =
          '<div class="gallery-empty"><p>Aucune photo S.O.U.L. pour le moment.<br><a href="espace-choristes.html">Soyez le premier à en partager une !</a></p></div>';
      } else {
        renderGroupedGalleries();
      }

      if (failed > 0) {
        alert(failed + ' suppression(s) ont échoué sur ' + total + '. Les autres ont bien été supprimées.');
      }
    }

    document.getElementById('gallery-select-btn').addEventListener('click', function() {
      const inMode = document.body.classList.contains('gallery-select-mode');
      if (!inMode) {
        document.body.classList.add('gallery-select-mode');
        selectedIds.clear();
        updateSelectBtn();
        return;
      }
      if (selectedIds.size === 0) {
        document.body.classList.remove('gallery-select-mode');
        updateSelectBtn();
        return;
      }
      deleteSelectedPhotos();
    });

    if (isChef()) document.body.classList.add('role-chef');

    // ---- Démarrage ----
    loadGallery();
  </script>
</body>
</html>
