<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title> <link rel="icon" href="assets/images/logo.png" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Lobster&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        .tiles-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr); /* Deux colonnes de taille égale */
            gap: 2rem; /* Espacement entre les tuiles */
            justify-content: center; /* Centrer les tuiles dans la grille */
        }

        @media (max-width: 768px) {
            .tiles-grid {
                grid-template-columns: 1fr; /* Une seule colonne sur mobile */
            }
        }
    </style>
</head>
<body>
    <header class="main-header">
        <div class="header-content">
            <img src="assets/images/logo.png" alt="Logo La Voix Libre" class="site-logo">
            <div class="site-titles">
                <h1 class="main-title">La Voix Libre</h1>
                <p class="subtitle">École de chant - Chorales - Rennes</p>
            </div>
        </div>
    </header>
    <main class="main-content">
        <section class="grid-section">
            <div class="tiles-grid" id="main-tiles-grid">
                </div>
        </section>
    </main>
    <footer class="main-footer">
        <div class="footer-content">
            <p>Contact : <a href="mailto:"></a></p> <div class="social-links">
                <a href="#" target="_blank" aria-label="Facebook La Voix Libre">Facebook</a>
                <a href="#" target="_blank" aria-label="Instagram La Voix Libre">Instagram</a>
                <a href="#" target="_blank" aria-label="YouTube La Voix Libre">YouTube</a>
            </div>
            <p>© 2025 La Voix Libre. Tous droits réservés.</p>
        </div>
    </footer>
    <script src="assets/js/main.js"></script>
</body>
</html>
